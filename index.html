<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#15171a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="531" />
<title>5/3/1 Forever</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./icon-180.png" />
<link rel="icon" href="./favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="./styles.css?v=6" />
</head>
<body>

<main id="view"></main>

<div class="timer" id="timer">
  <div>
    <div class="t-label" id="tLabel">Rest</div>
    <div class="t-time" id="tTime">0:00</div>
  </div>
  <div style="flex:1;height:2px;background:var(--line);margin:0 14px;border-radius:2px;overflow:hidden">
    <div id="tFill" style="height:100%;width:0;background:var(--accent);transition:width .25s linear"></div>
  </div>
  <button data-act="rest-stop">STOP</button>
</div>

<div id="sheetRoot" style="display:none"></div>
<div class="toast" id="toast"></div>

<script type="module" src="./app.js?v=6"></script>
</body>
</html>
